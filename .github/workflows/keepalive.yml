# Wakes the free Render API once an hour. Each wake starts the app, whose scheduler runs the job
# ingestion for every source that is due (each source keeps its own minimum interval).
name: Keep API awake

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping health endpoint (allows for a cold start)
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fsS --max-time 60 https://bespoke-api-sbc7.onrender.com/health; then
              echo; echo "API is awake"; exit 0
            fi
            echo "Attempt $i failed, retrying in 15s"; sleep 15
          done
          echo "API did not respond"; exit 1
