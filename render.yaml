# Render Blueprint: Bespoke API + Postgres (frontend is hosted on Vercel).
databases:
  - name: bespoke-db
    plan: free
    region: virginia
    postgresMajorVersion: "17"

services:
  - type: web
    name: bespoke-api
    runtime: docker
    plan: free
    region: virginia
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: bespoke-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@bespoke.app
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: SEED_DEMO_DATA
        value: "true"
      - key: AI_PROVIDER
        value: openai
      - key: OPENAI_MODEL
        value: gpt-5.5
      - key: OPENAI_MODEL_FAST
        value: gpt-5.4-mini
      - key: OPENAI_API_KEY
        sync: false
      - key: INGEST_ENABLED
        value: "true"
      - key: INGEST_INTERVAL_MINUTES
        value: "60"
      - key: LOCAL_UPLOAD_DIR
        value: /tmp/uploads
      # Set after the frontend is live on Vercel:
      - key: FRONTEND_URL
        value: https://bespoke-career.vercel.app
      - key: CORS_ORIGINS
        value: https://bespoke-career.vercel.app
      - key: PUBLIC_API_URL
        value: https://bespoke-api.onrender.com
